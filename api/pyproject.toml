[project]
name = "reportline-api"
version = "0.1.0"
description = "Reportline API - multi-tenant org chart service"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1",
  "flask-openapi3>=4.3",
  "pymongo>=4.9",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "testcontainers[mongodb]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "integration: touches a real MongoDB replica set (requires Docker)",
]

[tool.coverage.run]
source = ["app/services", "app/repos"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "migrations", "scripts"]
