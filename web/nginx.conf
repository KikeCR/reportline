# `proxy_pass` targets a variable, not a bare hostname, so nginx resolves
# `api` lazily per-request via Docker's embedded DNS (127.0.0.11) instead of
# once at startup - a static hostname makes nginx refuse to start at all if
# the api container isn't already up/resolvable yet (verified by running
# this image standalone, with no `api` on its network: nginx exited
# immediately with "host not found in upstream").
resolver 127.0.0.11 valid=10s;

server {
	listen 80;

	location / {
		root /usr/share/nginx/html;
		try_files $uri /index.html;
	}

	location /api/v1/ {
		set $api_upstream http://api:8000;
		proxy_pass $api_upstream;
	}

	location /healthz {
		set $api_upstream http://api:8000;
		proxy_pass $api_upstream;
	}

	location /readyz {
		set $api_upstream http://api:8000;
		proxy_pass $api_upstream;
	}
}
