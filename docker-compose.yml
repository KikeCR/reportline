# Local-only. Mongo runs as a single-node replica set (transactions need one)
# with no auth, via the same image used for dev/tests - simplest option,
# not the brief's more elaborate keyfile-auth setup.
services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    ports:
      - "27017:27017"

  api:
    build: ./api
    ports:
      - "5001:8000"
    environment:
      SECRET_KEY: dev-secret-not-for-prod
      MONGODB_URI: mongodb://mongo:27017/reportline?directConnection=true
      MONGODB_DB_NAME: reportline
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

  # One-off: docker compose run --rm seed
  seed:
    build: ./api
    command: sh -c "python -m migrations && python -m scripts.seed"
    environment:
      SECRET_KEY: dev-secret-not-for-prod
      MONGODB_URI: mongodb://mongo:27017/reportline?directConnection=true
      MONGODB_DB_NAME: reportline
    depends_on:
      mongo:
        condition: service_healthy
    profiles:
      - tools
