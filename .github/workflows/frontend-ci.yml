name: frontend-ci

on:
  push:
    paths: ["web/**"]
  pull_request:
    paths: ["web/**"]

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match the Node version used locally (24, the current LTS) -
          # the installed jsdom/undici need a `webidl.util.markAsUncloneable`
          # built-in that Node 20 doesn't have, which broke this pipeline
          # with "is not a function" even though it passes locally on 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: docker build -t reportline-web .
